name: contractV2
on:
  push:
    paths: ['contractV2/**', '.github/workflows/contract-v2.yml']
  pull_request:
    paths: ['contractV2/**', '.github/workflows/contract-v2.yml']
permissions:
  contents: read
env:
  FOUNDRY_VERSION: v1.5.0
defaults:
  run:
    working-directory: contractV2
jobs:
  unit:
    name: V2 build, sizes and offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: forge build --sizes
      - run: forge test
      - name: Reject known-bug assertions
        run: |
          if grep -rnE 'function[[:space:]]+test(Fuzz|Fail)?_?BUG_' test/; then
            echo "::error::Known-bug assertions are present"
            exit 1
          fi
